name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the sample exactly as a developer evaluating the SDK would: from Maven Central, with
  # no access to the private SDK source. That makes this permanent, automated proof that the
  # published artifacts actually resolve and compile — an HTTP 200 on repo1.maven.org says the
  # files are there, not that Gradle can resolve them into a working build.
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The sample applies the Google Services plugin, which fails the build if
      # google-services.json is absent. The real file is yours and is gitignored, so CI drops in
      # the committed placeholder — enough to compile, not enough to reach Firebase.
      - name: Provide placeholder google-services.json
        run: cp sample/google-services.ci.json sample/google-services.json

      # The point of this job is *where* the SDK comes from, and a green build alone doesn't
      # establish that: the internal -Pdaakia.useLocalSdk composite, mavenLocal(), or a stale
      # cache would all still compile. Assert the resolved module is the published version from
      # a remote repository before trusting anything below.
      - name: Assert the SDK resolves from Maven Central
        run: |
          version=$(grep -E '^daakiaCallkit = ' gradle/libs.versions.toml | cut -d'"' -f2)
          echo "Expecting ai.daakia:callkit-core:$version from Maven Central"
          ./gradlew :sample:dependencyInsight --dependency ai.daakia:callkit-core \
            --configuration debugRuntimeClasspath --no-configuration-cache | tee insight.txt
          if grep -q "project '" insight.txt; then
            echo "::error::callkit-core resolved to a local project, not Maven Central. This job must build against the published artifacts — check for a stray -Pdaakia.useLocalSdk or an added mavenLocal()."
            exit 1
          fi
          if ! grep -q "^ai\.daakia:callkit-core:$version" insight.txt; then
            echo "::error::Expected ai.daakia:callkit-core:$version on the runtime classpath. Either the version in gradle/libs.versions.toml is not published yet, or something is overriding it."
            exit 1
          fi

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Build the sample
        run: ./gradlew :sample:assembleDebug

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: '**/build/reports/'
