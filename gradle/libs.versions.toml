[versions]
# The Daakia CallKit SDK. Bump this one line to move the sample to a new release.
daakiaCallkit = "1.0.0"

# Must stay in step with the SDK repo's catalog. A Gradle composite build shares one plugin
# classloader, so if these drift the -Pdaakia.useLocalSdk build breaks while both builds still
# work standalone. AGP is additionally pinned to what the installed Android Studio supports.
agp = "9.2.1"
kotlin = "2.3.0"

coroutines = "1.11.0"
coreKtx = "1.19.0"
firebaseMessaging = "25.1.1"
material = "1.14.0"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
ktlint = "14.2.0"
googleGmsGoogleServices = "4.5.0"

[libraries]
daakia-callkit-ui-compose = { group = "ai.daakia", name = "callkit-ui-compose", version.ref = "daakiaCallkit" }
daakia-callkit-ui-views = { group = "ai.daakia", name = "callkit-ui-views", version.ref = "daakiaCallkit" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleGmsGoogleServices" }
